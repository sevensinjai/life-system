<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>System — web client</title>
    <meta
      name="description"
      content="A browser client for exercising the System API by hand."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070b14'/%3E%3Cpath d='M16 5l9 11-9 11-9-11z' fill='none' stroke='%235cc8ff' stroke-width='2.4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./static/styles.css" />
  </head>
  <body>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">&#9670;</span>
        <span class="brand-name">SYSTEM</span>
        <span class="brand-sub">web client</span>
      </div>

      <div class="topbar-controls">
        <label class="inline-field">
          <span>API</span>
          <input
            id="api-base"
            type="text"
            spellcheck="false"
            placeholder="same origin"
            aria-label="API base URL"
          />
        </label>
        <button id="api-base-save" class="btn ghost" type="button">Connect</button>
        <span id="health" class="pill pending">checking&hellip;</span>
        <button id="sign-out" class="btn ghost" type="button" hidden>Sign out</button>
      </div>
    </header>

    <main class="shell">
      <!-- Signed out: register or log in. -->
      <section id="auth" class="auth" hidden>
        <div class="card">
          <h2>Log in</h2>
          <form id="login-form" class="stack">
            <label class="field">
              <span>Email</span>
              <input name="email" type="email" autocomplete="username" required />
            </label>
            <label class="field">
              <span>Password</span>
              <input
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </label>
            <button class="btn primary" type="submit">Enter the System</button>
          </form>
        </div>

        <div class="card">
          <h2>Register</h2>
          <form id="register-form" class="stack">
            <label class="field">
              <span>Email</span>
              <input name="email" type="email" autocomplete="username" required />
            </label>
            <label class="field">
              <span>Password</span>
              <input
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <small>At least 8 characters.</small>
            </label>
            <label class="field">
              <span>Hunter name</span>
              <input name="name" type="text" maxlength="80" required />
            </label>
            <label class="field">
              <span>Timezone</span>
              <input name="timezone" type="text" spellcheck="false" required />
              <small>IANA name; quests reset at midnight here.</small>
            </label>
            <button class="btn primary" type="submit">Awaken</button>
          </form>
        </div>

        <p class="auth-note">
          A token is stored in this browser's local storage so a reload keeps you
          signed in. Point <strong>API</strong> at another host to test a
          deployed backend instead of this one.
        </p>
      </section>

      <!-- Signed in. -->
      <section id="workspace" hidden>
        <nav class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="status" type="button">Status</button>
          <button class="tab" role="tab" data-tab="board" type="button">Board</button>
          <button class="tab" role="tab" data-tab="quests" type="button">Quests</button>
          <button class="tab" role="tab" data-tab="quotes" type="button">Quotes</button>
          <button class="tab" role="tab" data-tab="log" type="button">Log</button>
          <button class="tab" role="tab" data-tab="requests" type="button">Requests</button>
          <button id="refresh-all" class="btn ghost tabs-action" type="button">
            Refresh
          </button>
        </nav>

        <div id="view-status" class="view" role="tabpanel" hidden></div>
        <div id="view-board" class="view" role="tabpanel" hidden></div>
        <div id="view-quests" class="view" role="tabpanel" hidden></div>
        <div id="view-quotes" class="view" role="tabpanel" hidden></div>
        <div id="view-log" class="view" role="tabpanel" hidden></div>
        <div id="view-requests" class="view" role="tabpanel" hidden></div>
      </section>
    </main>

    <script type="module" src="./static/app.js"></script>
  </body>
</html>
